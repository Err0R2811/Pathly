<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff8fab",
                        "background-light": "#F6F1E8",
                        "background-dark": "#230f14",
                        "accent-teal": "#4fd1c5",
                        "accent-yellow": "#f6e05e",
                        "soft-pink": "#ffc2d1"
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'cartoon': '4px 4px 0px 0px rgba(0,0,0,1)',
                    }
                },
            },
        }
    </script>
<style>
        .cartoon-border {
            border: 3px solid #000000;
        }
        .floating-doodle {
            position: absolute;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen relative overflow-hidden">
<!-- Floating Doodles -->
<div class="floating-doodle top-10 left-10 text-primary">
<span class="material-symbols-outlined text-4xl">music_note</span>
</div>
<div class="floating-doodle top-40 right-10 text-accent-teal">
<span class="material-symbols-outlined text-5xl">auto_stories</span>
</div>
<div class="floating-doodle bottom-20 left-10 text-accent-yellow">
<span class="material-symbols-outlined text-4xl">star_rate</span>
</div>
<div class="floating-doodle top-1/2 right-5 text-primary">
<span class="material-symbols-outlined text-3xl">celebration</span>
</div>
<!-- Main Container -->
<div class="relative z-10 flex flex-col min-h-screen max-w-[480px] mx-auto p-6">
<!-- Top Navigation -->
<div class="flex items-center justify-between mb-8">
<button class="size-12 flex items-center justify-center bg-white cartoon-border rounded shadow-cartoon">
<span class="material-symbols-outlined text-black font-bold">arrow_back</span>
</button>
<div class="h-2 flex-1 mx-4 bg-white cartoon-border rounded-full overflow-hidden">
<div class="w-1/3 h-full bg-primary"></div>
</div>
<div class="text-black font-bold text-sm">1/3</div>
</div>
<!-- Hero Section -->
<div class="flex flex-col items-center text-center mb-10">
<div class="w-32 h-32 bg-accent-teal cartoon-border rounded-xl shadow-cartoon flex items-center justify-center mb-6 overflow-hidden">
<div class="bg-white/20 w-full h-full flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-white">rocket_launch</span>
</div>
</div>
<h1 class="text-4xl font-extrabold text-slate-900 dark:text-slate-100 leading-tight">
                Let’s learn something cool!
            </h1>
</div>
<!-- Goal Setting Section -->
<div class="space-y-8">
<div class="flex flex-col gap-2">
<h2 class="text-xl font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                    What’s the goal?
                    <span class="material-symbols-outlined text-primary">target</span>
</h2>
<div class="relative">
<input class="w-full h-16 bg-white cartoon-border border-primary rounded-xl px-6 text-xl font-bold text-slate-900 focus:ring-0 focus:border-primary shadow-cartoon placeholder:text-slate-300" type="text" value="Magic Tricks"/>
</div>
</div>
<div class="flex flex-col gap-2">
<h2 class="text-xl font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                    How long per day?
                    <span class="material-symbols-outlined text-accent-yellow">timer</span>
</h2>
<div class="relative">
<input class="w-full h-16 bg-white cartoon-border border-accent-yellow rounded-xl px-6 text-xl font-bold text-slate-900 focus:ring-0 focus:border-accent-yellow shadow-cartoon" placeholder="Maybe 15 mins?" type="text"/>
</div>
<p class="text-sm font-bold text-slate-600 px-2">Little steps lead to big jumps! 🐰</p>
</div>
</div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Action Button -->
<div class="mt-8 pb-4">
<button class="w-full h-16 bg-primary cartoon-border rounded-xl shadow-cartoon flex items-center justify-center gap-3 active:translate-x-1 active:translate-y-1 active:shadow-none transition-all">
<span class="text-xl font-extrabold text-black">START MY JOURNEY</span>
<span class="material-symbols-outlined text-black font-bold">arrow_forward</span>
</button>
</div>
</div>
<!-- Abstract Decor Image -->
<div class="hidden">
<img data-alt="Cartoon rocket flying through pastel stars" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChjpO_QBmOb1iEsDSZ0iBgUhEkfrqMbemk0TfwL9l1zoOIpNvUvTIzNln2SwvwnCKP-1rPfNIRIUt2TM4p7mRkrY5OvgvSria2uOR_sDShOhTkTEa_EVRcvA_zYPe9eda3QiNta1L0nA6NZB9oerAPZjVSsKx1gitrRryrXlUJpJjn9lPDfzoy6o-zVtIY7KRI_T937sI3SEoR-ztxsrYLIrzVlcU95e67kChaIcuOorw_RJkn9zb5I9M0Rsq96CSjiRpfVe-HNm4"/>
</div>
</body></html>
