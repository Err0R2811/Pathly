services:
  - type: web
    name: pathly-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pathly-db
          property: connectionString

databases:
  - name: pathly-db
    databaseName: pathly
    plan: free
