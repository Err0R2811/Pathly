[tool.poetry]
name = "pathly_backend"
version = "0.2.0"
description = "FastAPI backend for Pathly AI curriculum generation"
authors = ["Pathly Team"]

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
aiosqlite = "^0.20.0"
httpx = "^0.27.0"
pydantic = "^2.7.0"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
