<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neon Light Lesson Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff8fab",
                        "neon-pink": "#ff007f",
                        "neon-yellow": "#ffea00",
                        "neon-green": "#b8e0d2",
                        "background-light": "#fdf8f1",
                        "background-dark": "#1a0b0e",
                        "pastel-green": "#b8e0d2",
                        "accent-border": "#1d0c10",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .neon-pink-glow {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6), 0 0 20px rgba(255, 0, 127, 0.3);
        }
        .neon-yellow-glow {
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.6), 0 0 20px rgba(255, 234, 0, 0.3);
        }
        .progress-glow {
            box-shadow: 0 0 15px rgba(184, 224, 210, 0.8);
        }
        .card-aura {
            box-shadow: 0 0 40px rgba(255, 143, 171, 0.15), 8px 8px 0px 0px rgba(29, 12, 16, 1);
        }
        .doodle-float {
            position: absolute;
            z-index: 0;
            opacity: 0.8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col max-w-[430px] mx-auto shadow-2xl bg-background-light dark:bg-background-dark overflow-hidden">
<div class="doodle-float top-10 -left-2 text-neon-pink neon-pink-glow">
<span class="material-symbols-outlined text-5xl">auto_fix_high</span>
</div>
<div class="doodle-float bottom-48 -right-4 text-neon-yellow neon-yellow-glow">
<span class="material-symbols-outlined text-6xl">draw</span>
</div>
<div class="doodle-float top-1/2 -left-6 text-neon-pink/40 neon-pink-glow">
<span class="material-symbols-outlined text-4xl">celebration</span>
</div>
<header class="relative z-10 p-4 pt-6 space-y-4">
<div class="flex items-center justify-between">
<button class="flex items-center justify-center size-10 rounded-full bg-white border-2 border-accent-border shadow-[4px_4px_0px_0px_rgba(29,12,16,1)]">
<span class="material-symbols-outlined text-accent-border">arrow_back</span>
</button>
<h1 class="text-accent-border text-lg font-bold flex-1 text-center px-2 uppercase tracking-tight">Magic Trick #1: Coin Vanish</h1>
<button class="flex items-center justify-center size-10 rounded-full bg-white border-2 border-accent-border shadow-[4px_4px_0px_0px_rgba(29,12,16,1)]">
<span class="material-symbols-outlined text-accent-border">more_horiz</span>
</button>
</div>
<div class="space-y-2 px-2">
<div class="flex justify-between items-center text-accent-border/70 font-bold text-sm uppercase tracking-wider">
<span>Lesson Progress</span>
<span>Step 1 of 3</span>
</div>
<div class="h-5 w-full bg-white border-2 border-accent-border rounded-full overflow-hidden p-0.5">
<div class="h-full bg-pastel-green rounded-full border-r-2 border-accent-border progress-glow" style="width: 33.3%;"></div>
</div>
</div>
</header>
<main class="relative z-10 flex-1 p-4 flex flex-col justify-center">
<div class="bg-white border-[3px] border-accent-border rounded-xl card-aura overflow-hidden flex flex-col">
<div class="aspect-square w-full bg-primary/5 relative overflow-hidden border-b-[3px] border-accent-border flex items-center justify-center">
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#ff8fab 2px, transparent 2px); background-size: 20px 20px;"></div>
<div class="relative z-10 w-full h-full p-8 flex items-center justify-center">
<div class="w-full h-full bg-white rounded-lg border-2 border-accent-border overflow-hidden shadow-inner flex items-center justify-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCC8ccE0U25f11HZBjykeSkn3CY10r95dQsXKAl6w1YM6ovzS2r3IfSi_v-pS2FqCBMTOf-wxg2kUy7yyFkO_0ZA7EOfY6gGJEQIZB-RdhmoYoOTVIbw-Ka4oQ2bsrInPuDnMkx-12SmuOK7hccuddLS6Lk0QboZ3rX32u7IMIPopaZbuL2mWmTYLG3VuDq1vo_Y7qluXKe09yKaqchmfB2g-RyjdinXToRRbf3HKisV3UBLB0VGOZmYtybXfthR7SSQldmS7lAVjE'); background-size: cover; background-position: center;">
<span class="material-symbols-outlined text-8xl text-primary/40">visibility_off</span>
</div>
</div>
</div>
<div class="p-6 space-y-4">
<div class="inline-block px-3 py-1 bg-primary/10 text-neon-pink border-2 border-primary/30 rounded-full text-xs font-bold uppercase tracking-widest">
                    Step 1: The Grip
                </div>
<h2 class="text-2xl font-bold text-accent-border leading-tight">Master the "Classic Palm"</h2>
<p class="text-accent-border/80 leading-relaxed font-medium">
                    Hold the coin between your thumb and index finger. Keep your palm facing yourself to hide the movement from your audience. It's all about the angle!
                </p>
<button class="flex items-center gap-2 text-primary font-extrabold hover:text-neon-pink transition-colors">
<span class="material-symbols-outlined">play_circle</span>
<span class="uppercase text-xs tracking-widest">Watch Video Tutorial</span>
</button>
</div>
</div>
</main>
<footer class="relative z-10 p-6 pb-10 flex gap-4 bg-background-light/60 backdrop-blur-md">
<button class="flex-1 h-14 rounded-xl border-[3px] border-accent-border bg-white text-accent-border font-bold text-lg shadow-[4px_4px_0px_0px_rgba(29,12,16,1)] active:translate-y-1 active:shadow-none transition-all">
            Back
        </button>
<button class="flex-[2] h-14 rounded-xl border-[3px] border-accent-border bg-primary text-accent-border font-bold text-lg shadow-[4px_4px_0px_0px_rgba(29,12,16,1)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2">
<span>Next Step</span>
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</footer>
</div>

</body></html>
