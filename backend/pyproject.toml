[tool.poetry]
name = "pathly_backend"
version = "0.2.0"
description = "FastAPI backend for Pathly AI curriculum generation"
authors = ["Pathly Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.10"
httpx = "^0.27.0"
pydantic = "^2.7.0"
youtube-transcript-api = "^0.6.2"
google-api-python-client = "^2.100.0"
passlib = "^1.7.4"
bcrypt = "^4.1.2"
pyjwt = "^2.8.0"
python-multipart = "^0.0.18"
prometheus-fastapi-instrumentator = "^7.0.0"
slowapi = "^0.1.9"
redis = "^5.0.0"
qdrant-client = "^1.12.0"
sentence-transformers = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
httpx = "^0.27.0"
playwright = "^1.45.0"
pytest-playwright = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
